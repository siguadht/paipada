<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客厅遮罩预检 · 拍拍搭</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(20px, 4vw, 64px); background: #fafafa; color: #171717; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { max-width: 1500px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 46px); }
    p { margin: 0 0 24px; color: #666; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 20px; }
    figure { margin: 0; padding: 12px; border: 1px solid #ddd; border-radius: 18px; background: white; }
    img { width: 100%; display: block; border-radius: 10px; }
    figcaption { padding: 10px 3px 2px; font-weight: 600; }
  </style>
</head>
<body><main>
  <h1>第二空间 · 客厅遮罩预检</h1>
  <p>左图为原照。右图黑色区域要求保留，白色区域允许放置软装和清理地面。当前只有离线输入，尚无真实生成结果。</p>
  <div class="grid">
    <figure><img src="../阶段3-2/真实双空间/客厅-原图.jpg" alt="客厅原始照片"><figcaption>客厅原照</figcaption></figure>
    <figure><img src="客厅窗墙保护-单通道遮罩.png" alt="大窗、窗帘和吊顶为黑色保留区的遮罩"><figcaption>接口用单通道遮罩</figcaption></figure>
  </div>
</main></body></html>
