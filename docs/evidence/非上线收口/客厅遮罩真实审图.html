<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客厅遮罩真实审图 · 拍拍搭</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(20px, 4vw, 64px); background: #fafafa; color: #171717; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { max-width: 1500px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 46px); }
    p { margin: 0 0 24px; color: #666; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 20px; }
    figure { margin: 0; padding: 12px; border: 1px solid #ddd; border-radius: 18px; background: white; }
    img { width: 100%; display: block; border-radius: 10px; }
    figcaption { padding: 10px 3px 2px; font-weight: 600; }
    .note { margin-top: 24px; max-width: 920px; }
  </style>
</head>
<body><main>
  <h1>第二空间 · 客厅真实结果</h1>
  <p>技术验证图，不是最终产品演示素材。从已留档的客厅原照出发，使用一次即梦交互编辑 inpainting。黑色遮罩要求保留，白色区域允许生成软装。本页展示模型原始结果，没有手工合成修图。</p>
  <div class="grid">
    <figure><img src="../阶段3-2/真实双空间/客厅-原图.jpg" alt="客厅原始照片"><figcaption>01 原始照片</figcaption></figure>
    <figure><img src="客厅-即梦遮罩单次结果.jpg" alt="一次遮罩生成的客厅结果"><figcaption>02 一次真实生成</figcaption></figure>
    <figure><img src="客厅窗墙保护-单通道遮罩.png" alt="窗墙保护遮罩，黑色保留白色编辑"><figcaption>03 实际提交的遮罩</figcaption></figure>
  </div>
  <p class="note">审图重点：大窗、窗框、窗帘和吊顶是否保持；沙发、茶几、地毯是否合理。原有深色窗帘和红色海报被保留，风格是否能用于演示需人工判断。该图不证明精确锁定结构，也不证明全屋风格一致。</p>
</main></body></html>
