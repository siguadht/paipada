<body><main>
  <h1>方案记录改版</h1>
  <p>把整屏长文字收起，先用图片卡片展示每一版，旧版有明确的恢复按钮。初始设计说明仍可展开查看，并注明可能与修改后的图不一致。以下均为已有测试方案，无新增生图。</p>
  <nav><a href="#two">两版效果</a><a href="#one">单版效果</a><a href="#phone">手机效果</a></nav>
  <section id="two"><h2>两版方案</h2><p>可以直接比较初版与重生版，并看见当前使用哪一版。</p><img src="方案记录改版-桌面两版.png" alt="两版方案的桌面正式页面截图"><a href="http://127.0.0.1:3000/design/c221ac2b-da08-40d7-91db-f9d42f7ee490">打开实际方案 →</a></section>
  <section id="one"><h2>单版方案</h2><p>只有一版时保留一张清楚的图片卡，说明默认收起。</p><img src="方案记录改版-桌面一版.png" alt="单版方案的桌面正式页面截图"><a href="http://127.0.0.1:3000/design/2f96443a-6473-430e-9d22-b4eb3107f17e">打开实际方案 →</a></section>
  <section id="phone"><h2>手机页面</h2><p>版本卡片可横向浏览，整页无横向溢出。</p><img src="方案记录改版-手机两版.png" alt="两版方案的手机正式页面截图"><small>手机宽度 390px</small></section>
